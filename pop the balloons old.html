<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pop the Balloons Deluxe</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #bfe9ff, #eaf9ff 55%, #f8fff2);
      touch-action: manipulation;
      user-select: none;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .skyGlow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.7), transparent 18%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,.55), transparent 20%),
        radial-gradient(circle at 50% 80%, rgba(255,255,255,.25), transparent 24%);
    }

    .top {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .leftStats, .rightBtns {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pill, .btn {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 800;
      color: #233;
      background: rgba(255,255,255,.92);
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      white-space: nowrap;
    }

    .hero {
      position: absolute;
      left: 50%;
      top: 58px;
      transform: translateX(-50%);
      z-index: 20;
      width: min(92vw, 520px);
      background: rgba(255,255,255,.92);
      border-radius: 30px;
      box-shadow: 0 10px 28px rgba(0,0,0,.12);
      padding: 14px 16px;
      text-align: center;
    }

    .modeLine {
      font-size: 14px;
      font-weight: 800;
      color: #5b748d;
      margin-bottom: 4px;
    }

    .word {
      font-size: clamp(24px, 6vw, 42px);
      font-weight: 900;
      color: #203040;
      line-height: 1.1;
    }

    .sub {
      margin-top: 4px;
      font-size: clamp(14px, 3.8vw, 18px);
      font-weight: 700;
      color: #5e768d;
    }

    .progressWrap {
      margin-top: 10px;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(32,48,64,.1);
      overflow: hidden;
    }

    .progressBar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #6ed7ff, #7ae582);
      transition: width .25s ease;
    }

    .playArea {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .balloon {
      position: absolute;
      width: 108px;
      height: 132px;
      border: none;
      border-radius: 55% 55% 50% 50% / 48% 48% 58% 58%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 54px;
      color: #14212e;
      box-shadow:
        inset -14px -20px 18px rgba(0,0,0,.08),
        inset 12px 14px 18px rgba(255,255,255,.22),
        0 10px 22px rgba(0,0,0,.12);
      cursor: pointer;
      transform-origin: center center;
      transition: transform .08s linear;
      animation-name: riseUp;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }

    .balloon:active {
      transform: scale(.98);
    }

    .balloon::before {
      content: "";
      position: absolute;
      top: 18px;
      left: 18px;
      width: 18px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,.35);
      transform: rotate(20deg);
    }

    .balloon::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -28px;
      width: 2px;
      height: 34px;
      background: rgba(90,90,90,.4);
      transform: translateX(-50%);
    }

    .special {
      box-shadow:
        0 0 0 5px rgba(255,255,255,.55),
        0 0 26px rgba(255,214,102,.95),
        inset -14px -20px 18px rgba(0,0,0,.08),
        inset 12px 14px 18px rgba(255,255,255,.22),
        0 10px 22px rgba(0,0,0,.12);
    }

    .pop {
      animation: none !important;
      transform: scale(1.22);
      opacity: 0;
      transition: transform .2s ease, opacity .2s ease;
    }

    .floatWord {
      position: absolute;
      pointer-events: none;
      font-size: 24px;
      font-weight: 900;
      color: #1c3552;
      animation: riseWord .8s ease-out forwards;
      text-shadow: 0 2px 8px rgba(255,255,255,.7);
      z-index: 25;
    }

    .burst {
      position: absolute;
      pointer-events: none;
      font-size: 28px;
      animation: sparkle .75s ease-out forwards;
      z-index: 24;
    }

    .footer {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(255,255,255,.88);
      color: #3d5770;
      font-size: 14px;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0,0,0,.1);
      white-space: nowrap;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.95);
      padding: 20px;
      text-align: center;
    }

    .overlay.hidden {
      display: none;
    }

    .overlayCard {
      background: #fff;
      border-radius: 28px;
      padding: 24px 20px;
      width: min(90vw, 480px);
      box-shadow: 0 14px 36px rgba(0,0,0,.12);
    }

    .overlayTitle {
      font-size: clamp(28px, 8vw, 48px);
      font-weight: 900;
      color: #1b2a3a;
      line-height: 1.1;
    }

    .overlaySub {
      margin-top: 8px;
      font-size: clamp(15px, 4vw, 20px);
      font-weight: 700;
      color: #61778d;
    }

    .overlayBtn {
      margin-top: 18px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(90deg, #76d7ff, #91ec86);
      color: #16303c;
      font-size: 18px;
      font-weight: 900;
      padding: 14px 22px;
      box-shadow: 0 10px 28px rgba(0,0,0,.12);
    }

    @keyframes riseUp {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-130vh);
      }
    }

    @keyframes riseWord {
      0% {
        transform: translateY(0) scale(.8);
        opacity: 1;
      }
      100% {
        transform: translateY(-45px) scale(1.15);
        opacity: 0;
      }
    }

    @keyframes sparkle {
      0% {
        transform: scale(.45) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: scale(1.5) rotate(70deg) translateY(-16px);
        opacity: 0;
      }
    }

    @media (max-width: 420px) {
      .pill, .btn {
        padding: 9px 12px;
        font-size: 13px;
      }

      .balloon {
        width: 95px;
        height: 118px;
        font-size: 46px;
      }

      .hero {
        top: 56px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="skyGlow"></div>

    <div class="top">
      <div class="leftStats">
        <div class="pill">⭐ <span id="score">0</span></div>
        <div class="pill">🏁 <span id="roundText">1/8</span></div>
      </div>

      <div class="rightBtns">
        <button id="modeBtn" class="btn">🎯 Learn</button>
        <button id="soundBtn" class="btn">🔊 Sound</button>
      </div>
    </div>

    <div class="hero">
      <div class="modeLine" id="modeLine">Learn Mode</div>
      <div class="word" id="word">Pop!</div>
      <div class="sub" id="sub">Tap balloons to learn words</div>
      <div class="progressWrap">
        <div id="progressBar" class="progressBar"></div>
      </div>
    </div>

    <div id="playArea" class="playArea"></div>

    <div class="footer">Bigger word set • rising balloons • special balloons</div>

    <div id="startOverlay" class="overlay">
      <div class="overlayCard">
        <div class="overlayTitle" id="overlayTitle">Pop the Balloons Deluxe 🎈</div>
        <div class="overlaySub" id="overlaySub">More words, rising balloons, and more game-like play</div>
        <button id="startBtn" class="overlayBtn">Tap to Start</button>
      </div>
    </div>
  </div>

  <script>
    const WORDS = [
      { emoji: "🐶", word: "Dog" },
      { emoji: "🐱", word: "Cat" },
      { emoji: "🐥", word: "Chick" },
      { emoji: "🦋", word: "Butterfly" },
      { emoji: "⭐", word: "Star" },
      { emoji: "🌙", word: "Moon" },
      { emoji: "☀️", word: "Sun" },
      { emoji: "🍎", word: "Apple" },
      { emoji: "🚗", word: "Car" },
      { emoji: "⚽", word: "Ball" },
      { emoji: "🐸", word: "Frog" },
      { emoji: "🐰", word: "Rabbit" },
      { emoji: "🐻", word: "Bear" },
      { emoji: "🦁", word: "Lion" },
      { emoji: "🐼", word: "Panda" },
      { emoji: "🐵", word: "Monkey" },
      { emoji: "🦆", word: "Duck" },
      { emoji: "🐟", word: "Fish" },
      { emoji: "🍌", word: "Banana" },
      { emoji: "🍇", word: "Grapes" },
      { emoji: "🥕", word: "Carrot" },
      { emoji: "🌼", word: "Flower" },
      { emoji: "🌈", word: "Rainbow" },
      { emoji: "☁️", word: "Cloud" },
      { emoji: "🚂", word: "Train" },
      { emoji: "✈️", word: "Plane" },
      { emoji: "🚜", word: "Tractor" },
      { emoji: "🧸", word: "Teddy" },
      { emoji: "🍼", word: "Bottle" },
      { emoji: "🎁", word: "Gift" },
      { emoji: "🍪", word: "Cookie" },
      { emoji: "🍉", word: "Melon" },
      { emoji: "🥎", word: "Toy Ball" },
      { emoji: "🦄", word: "Unicorn" },
      { emoji: "🐢", word: "Turtle" },
      { emoji: "🚲", word: "Bike" }
    ];

    const COLORS = [
      "#ff8fab", "#ffd166", "#90e0ef", "#caffbf",
      "#bdb2ff", "#ffc6a5", "#ffcfef", "#c7f9cc"
    ];

    const playArea = document.getElementById("playArea");
    const wordEl = document.getElementById("word");
    const subEl = document.getElementById("sub");
    const scoreEl = document.getElementById("score");
    const soundBtn = document.getElementById("soundBtn");
    const modeBtn = document.getElementById("modeBtn");
    const roundText = document.getElementById("roundText");
    const modeLine = document.getElementById("modeLine");
    const progressBar = document.getElementById("progressBar");
    const startOverlay = document.getElementById("startOverlay");
    const startBtn = document.getElementById("startBtn");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlaySub = document.getElementById("overlaySub");

    let score = 0;
    let round = 1;
    let totalRounds = 8;
    let balloons = [];
    let soundOn = true;
    let started = false;
    let mode = "learn";
    let voices = [];
    let speechUnlocked = false;
    let currentChoices = [];
    let targetItem = null;
    let wrongStreak = 0;
    let roundActive = false;

    function loadVoices() {
      if (!("speechSynthesis" in window)) return;
      voices = window.speechSynthesis.getVoices();
    }

    if ("speechSynthesis" in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function speak(text) {
      if (!soundOn || !speechUnlocked || !("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        if (!voices.length) voices = window.speechSynthesis.getVoices();

        const u = new SpeechSynthesisUtterance(text);
        const voice =
          voices.find(v => v.lang === "en-US") ||
          voices.find(v => v.lang === "en-GB") ||
          voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en")) ||
          null;

        if (voice) u.voice = voice;
        u.rate = 0.9;
        u.pitch = 1.08;
        u.volume = 0.95;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    function tone(freq = 620, duration = 0.09) {
      if (!soundOn) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.value = 0.0001;

        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        gain.gain.exponentialRampToValueAtTime(0.08, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.start(now);
        osc.stop(now + duration + 0.03);
      } catch (e) {}
    }

    function floatWord(text, x, y) {
      const fw = document.createElement("div");
      fw.className = "floatWord";
      fw.textContent = text;
      fw.style.left = x + "px";
      fw.style.top = y + "px";
      playArea.appendChild(fw);
      setTimeout(() => fw.remove(), 850);
    }

    function burst(x, y) {
      const symbols = ["✨", "⭐", "🎉", "💫", "🌟"];
      for (let i = 0; i < 5; i++) {
        const b = document.createElement("div");
        b.className = "burst";
        b.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        b.style.left = (x + rand(-28, 28)) + "px";
        b.style.top = (y + rand(-20, 20)) + "px";
        playArea.appendChild(b);
        setTimeout(() => b.remove(), 780);
      }
    }

    function updateHeader() {
      roundText.textContent = round + "/" + totalRounds;
      progressBar.style.width = (((round - 1) / totalRounds) * 100) + "%";
      scoreEl.textContent = score;

      if (mode === "learn") {
        modeBtn.textContent = "🎯 Learn";
        modeLine.textContent = "Learn Mode";
        if (!targetItem) {
          wordEl.textContent = "Pop!";
          subEl.textContent = "Tap balloons to learn words";
        }
      } else {
        modeBtn.textContent = "🔎 Find";
        modeLine.textContent = "Find Mode";
        if (targetItem) {
          wordEl.textContent = targetItem.word;
          subEl.textContent = "Find and pop " + targetItem.word;
        }
      }
    }

    function chooseRoundWords() {
      const count = mode === "learn" ? 5 : 6;
      currentChoices = shuffle(WORDS).slice(0, count);
      targetItem = mode === "find"
        ? currentChoices[Math.floor(Math.random() * currentChoices.length)]
        : null;
    }

    function clearBalloons() {
      balloons.forEach(b => {
        if (b && b.parentNode) b.remove();
      });
      balloons = [];
    }

    function scheduleRoundTimeout() {
      const maxDuration = Math.max(...balloons.map(b => b._duration || 8));
      setTimeout(() => {
        if (!roundActive) return;
        if (mode === "learn") {
          nextRound();
        } else {
          wrongStreak = 0;
          subEl.textContent = "Next round";
          nextRound();
        }
      }, (maxDuration * 1000) + 400);
    }

    function makeBalloon(item, left, color, special) {
      const b = document.createElement("button");
      b.className = "balloon" + (special ? " special" : "");
      b.type = "button";
      b.textContent = item.emoji;
      b.style.left = left + "px";
      b.style.bottom = "-150px";
      b.style.background = color;
      b.dataset.word = item.word;
      b.dataset.special = special ? "1" : "0";

      const duration = rand(8.5, 11.5);
      const delay = rand(0, 1.6);

      b.style.animationDuration = duration + "s";
      b.style.animationDelay = delay + "s";
      b._duration = duration + delay;

      b.addEventListener("click", () => onBalloonTap(b, item));

      b.addEventListener("animationend", () => {
        if (b.parentNode) b.remove();
        balloons = balloons.filter(x => x !== b);
      });

      playArea.appendChild(b);
      balloons.push(b);
    }

    function popBalloon(b, item, good, special) {
      const rect = b.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;

      b.classList.add("pop");
      burst(x, y);
      floatWord(item.word, x - 28, y - 12);

      if (good) {
        score += special ? 3 : 1;
        scoreEl.textContent = score;
        tone(special ? 900 : 720, 0.1);
        setTimeout(() => tone(special ? 1080 : 880, 0.12), 80);
      } else {
        tone(300, 0.08);
      }

      setTimeout(() => {
        if (b.parentNode) b.remove();
        balloons = balloons.filter(x => x !== b);
      }, 220);
    }

    function onBalloonTap(b, item) {
      if (!roundActive) return;

      const isSpecial = b.dataset.special === "1";

      if (mode === "learn") {
        wordEl.textContent = item.word;
        subEl.textContent = isSpecial ? "Bonus balloon!" : "Nice pop!";
        speak(item.word);
        popBalloon(b, item, true, isSpecial);

        if (balloons.length <= 1) {
          setTimeout(nextRound, 380);
        }
        return;
      }

      if (item.word === targetItem.word) {
        wrongStreak = 0;
        wordEl.textContent = item.word;
        subEl.textContent = isSpecial ? "Great! Bonus hit!" : "Great job!";
        speak(item.word);
        popBalloon(b, item, true, isSpecial);
        setTimeout(nextRound, 420);
      } else {
        wrongStreak += 1;
        wordEl.textContent = "Try " + targetItem.word;
        subEl.textContent = wrongStreak >= 2 ? "Look carefully" : "Oops, try again";

        b.animate(
          [
            { transform: "translateX(0px)" },
            { transform: "translateX(-8px)" },
            { transform: "translateX(8px)" },
            { transform: "translateX(0px)" }
          ],
          { duration: 220, easing: "ease-out" }
        );

        tone(260, 0.07);
        if (wrongStreak >= 2) speak(targetItem.word);
      }
    }

    function layoutRound() {
      clearBalloons();
      roundActive = true;

      const w = window.innerWidth;
      const count = currentChoices.length;
      const specialIndex = Math.random() < 0.35 ? Math.floor(Math.random() * count) : -1;

      const lanes = count <= 5
        ? [0.12, 0.30, 0.48, 0.66, 0.84]
        : [0.10, 0.24, 0.38, 0.52, 0.66, 0.80];

      currentChoices.forEach((item, i) => {
        const bw = window.innerWidth < 420 ? 95 : 108;
        const laneX = lanes[i % lanes.length];
        const left = Math.max(6, Math.min(w - bw - 6, (w * laneX) - (bw / 2) + rand(-8, 8)));
        makeBalloon(item, left, COLORS[i % COLORS.length], i === specialIndex);
      });

      scheduleRoundTimeout();
    }

    function nextRound() {
      if (!started) return;
      roundActive = false;
      round += 1;

      if (round > totalRounds) {
        endGame();
        return;
      }

      wrongStreak = 0;
      chooseRoundWords();
      updateHeader();
      layoutRound();

      if (mode === "find" && targetItem) {
        setTimeout(() => speak(targetItem.word), 300);
      }
    }

    function endGame() {
      roundActive = false;
      progressBar.style.width = "100%";
      wordEl.textContent = "Finished!";
      subEl.textContent = "Score: " + score + " • Tap to play again";
      clearBalloons();
      startOverlay.classList.remove("hidden");
      overlayTitle.textContent = "Great job! 🎉";
      overlaySub.textContent = "Score: " + score + " • Tap to play again";
      startBtn.textContent = "Play Again";
      started = false;
    }

    function startGame() {
      speechUnlocked = true;
      started = true;
      roundActive = false;
      startOverlay.classList.add("hidden");

      overlayTitle.textContent = "Pop the Balloons Deluxe 🎈";
      overlaySub.textContent = "More words, rising balloons, and more game-like play";
      startBtn.textContent = "Tap to Start";

      if ("speechSynthesis" in window) {
        try {
          const silent = new SpeechSynthesisUtterance(" ");
          silent.volume = 0;
          window.speechSynthesis.speak(silent);
          window.speechSynthesis.cancel();
        } catch (e) {}
      }

      score = 0;
      round = 1;
      wrongStreak = 0;
      chooseRoundWords();
      updateHeader();
      layoutRound();
      tone(700, 0.06);

      if (mode === "find" && targetItem) {
        setTimeout(() => speak(targetItem.word), 300);
      }
    }

    soundBtn.addEventListener("click", () => {
      soundOn = !soundOn;
      soundBtn.textContent = soundOn ? "🔊 Sound" : "🔇 Sound";
      if (soundOn && started) tone(700, 0.06);
    });

    modeBtn.addEventListener("click", () => {
      mode = mode === "learn" ? "find" : "learn";
      if (started) {
        round = 1;
        score = 0;
        wrongStreak = 0;
        chooseRoundWords();
        updateHeader();
        layoutRound();
        if (mode === "find" && targetItem) {
          setTimeout(() => speak(targetItem.word), 300);
        }
      } else {
        updateHeader();
      }
    });

    startBtn.addEventListener("pointerdown", startGame);

    startOverlay.addEventListener("pointerdown", (e) => {
      if (e.target === startOverlay) startGame();
    });

    window.addEventListener("resize", () => {
      if (started) {
        layoutRound();
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    });

    updateHeader();
  </script>
</body>
</html>
