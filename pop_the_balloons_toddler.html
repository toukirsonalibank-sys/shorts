<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>🎈 Pop the Balloons!</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Nunito', Arial, sans-serif;
      background: linear-gradient(180deg, #87ceeb 0%, #b8eaff 40%, #d4f5c0 80%, #f0fce8 100%);
      touch-action: manipulation;
      user-select: none;
    }

    .clouds { position:absolute; inset:0; pointer-events:none; z-index:0; overflow:hidden; }

    .top {
      position:absolute; top:10px; left:10px; right:10px;
      z-index:30; display:flex; align-items:center; justify-content:space-between; gap:8px;
    }
    .pill {
      border:none; border-radius:999px; padding:10px 16px;
      font-size:17px; font-weight:900; font-family:'Nunito',Arial,sans-serif;
      color:#2a3d50; background:rgba(255,255,255,0.95);
      box-shadow:0 4px 18px rgba(0,0,0,.15); white-space:nowrap; line-height:1;
    }
    .btn {
      border:none; border-radius:999px; padding:10px 14px;
      font-size:15px; font-weight:900; font-family:'Nunito',Arial,sans-serif;
      color:#2a3d50; background:rgba(255,255,255,0.92);
      box-shadow:0 4px 18px rgba(0,0,0,.13); white-space:nowrap; cursor:pointer;
    }
    .btn:active { transform:scale(0.95); }

    .hero {
      position:absolute; left:50%; top:60px; transform:translateX(-50%);
      z-index:20; width:min(94vw,500px);
      background:rgba(255,255,255,0.95); border-radius:28px;
      box-shadow:0 8px 28px rgba(0,0,0,.12); padding:14px 18px 12px; text-align:center;
    }
    .modeLine { font-size:13px; font-weight:900; color:#7a9ab8; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:2px; }
    .word { font-size:clamp(28px,7vw,46px); font-weight:900; color:#1a2f40; line-height:1.1; }
    .sub  { margin-top:4px; font-size:clamp(15px,4vw,19px); font-weight:700; color:#6082a0; }
    .progressWrap { margin-top:10px; width:100%; height:12px; border-radius:999px; background:rgba(32,48,64,.1); overflow:hidden; }
    .progressBar  { height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,#ffd166,#7ae582); transition:width .4s ease; }

    .playArea { position:absolute; inset:0; overflow:hidden; z-index:1; }

    /* ── BALLOON ── */
    .balloon {
      position:absolute;
      width:120px; height:148px;
      border:none;
      border-radius:55% 55% 50% 50% / 48% 48% 58% 58%;
      display:flex; align-items:center; justify-content:center;
      font-size:60px; color:#14212e;
      box-shadow:
        inset -16px -22px 20px rgba(0,0,0,.07),
        inset 14px 16px 22px rgba(255,255,255,.28),
        0 12px 28px rgba(0,0,0,.14);
      cursor:pointer;
      /* ONLY riseUp — no second animation on base class */
      animation: riseUp linear forwards;
      will-change: transform;
      -webkit-tap-highlight-color: transparent;
    }
    .balloon::before {
      content:""; position:absolute; top:16px; left:16px;
      width:22px; height:32px; border-radius:50%;
      background:rgba(255,255,255,.4); transform:rotate(20deg); pointer-events:none;
    }
    .balloon::after {
      content:""; position:absolute; left:50%; bottom:-32px;
      width:2px; height:38px; background:rgba(70,70,70,.35);
      transform:translateX(-50%); pointer-events:none;
    }

    /* Golden special – glimmer is on a CHILD span, not the balloon itself */
    .balloon.special {
      box-shadow:
        0 0 0 5px rgba(255,255,255,.6),
        0 0 30px rgba(255,214,80,.9),
        inset -16px -22px 20px rgba(0,0,0,.07),
        inset 14px 16px 22px rgba(255,255,255,.28),
        0 12px 28px rgba(0,0,0,.14);
    }
    /* glimmer overlay inside balloon, doesn't affect animationend on button */
    .glimmerLayer {
      position:absolute; inset:0; border-radius:inherit;
      animation: glimmer 1.5s ease-in-out infinite;
      pointer-events:none;
    }

    /* Pop – replaces riseUp entirely */
    .balloon.popping {
      animation: popOut 0.22s ease-out forwards !important;
      pointer-events: none !important;
    }

    .floatWord {
      position:absolute; pointer-events:none;
      font-size:26px; font-weight:900; font-family:'Nunito',Arial,sans-serif;
      color:#1c3552; animation:riseWord .9s ease-out forwards;
      text-shadow:0 2px 10px rgba(255,255,255,.8); z-index:25; white-space:nowrap;
    }
    .burst {
      position:absolute; pointer-events:none; font-size:32px;
      animation:sparkle .8s ease-out forwards; z-index:24;
    }
    .starPop {
      position:absolute; pointer-events:none; font-size:52px;
      z-index:28; animation:starBoom .6s ease-out forwards;
    }

    .celebration { position:absolute; inset:0; pointer-events:none; z-index:35; overflow:hidden; }
    .confetti    { position:absolute; border-radius:2px; animation:confettiFall linear forwards; }

    /* ── OVERLAYS ── */
    .overlay {
      position:absolute; inset:0; z-index:40; display:flex;
      align-items:center; justify-content:center;
      background:rgba(135,206,235,.88); padding:20px; text-align:center;
    }
    .overlay.hidden { display:none; }
    .overlayCard {
      background:#fff; border-radius:32px; padding:28px 24px;
      width:min(92vw,480px); box-shadow:0 16px 40px rgba(0,0,0,.15);
    }
    .overlayTitle { font-size:clamp(30px,9vw,52px); font-weight:900; color:#1b2a3a; line-height:1.1; }
    .overlaySub   { margin-top:8px; font-size:clamp(16px,4.5vw,22px); font-weight:700; color:#5e7a8d; }
    .overlayBtn {
      margin-top:16px; border:none; border-radius:999px;
      background:linear-gradient(90deg,#ffd166,#7ae582); color:#1a3020;
      font-size:22px; font-weight:900; font-family:'Nunito',Arial,sans-serif;
      padding:18px 32px; box-shadow:0 10px 30px rgba(0,0,0,.15);
      cursor:pointer; display:block; width:100%;
    }
    .overlayBtn:active { transform:scale(0.97); }
    .modePicker { display:flex; gap:10px; margin-top:14px; justify-content:center; }
    .modePickBtn {
      flex:1; border:3px solid transparent; border-radius:18px;
      padding:12px 8px; font-size:16px; font-weight:900;
      font-family:'Nunito',Arial,sans-serif; cursor:pointer;
      background:#f0f6ff; color:#2a3d50; transition:all .15s;
    }
    .modePickBtn.active { border-color:#6ed7ff; background:#e0f6ff; }

    /* ── KEYFRAMES ── */
    @keyframes riseUp {
      0%   { transform:translateY(0) rotate(0deg); }
      25%  { transform:translateY(-25vh) rotate(2deg); }
      50%  { transform:translateY(-50vh) rotate(-2deg); }
      75%  { transform:translateY(-75vh) rotate(2deg); }
      100% { transform:translateY(-140vh) rotate(0deg); }
    }
    @keyframes glimmer {
      0%,100% { background:rgba(255,255,255,0); }
      50%      { background:rgba(255,255,255,.18); }
    }
    @keyframes popOut {
      0%   { transform:scale(1);   opacity:1; }
      40%  { transform:scale(1.4); opacity:.7; }
      100% { transform:scale(0.05);opacity:0; }
    }
    @keyframes riseWord {
      0%   { transform:translateY(0) scale(.8);    opacity:1; }
      100% { transform:translateY(-55px) scale(1.2); opacity:0; }
    }
    @keyframes sparkle {
      0%   { transform:scale(.4) rotate(0deg); opacity:1; }
      100% { transform:scale(1.6) rotate(80deg) translateY(-20px); opacity:0; }
    }
    @keyframes starBoom {
      0%   { transform:scale(0) rotate(-20deg); opacity:1; }
      50%  { transform:scale(1.4) rotate(10deg); opacity:1; }
      100% { transform:scale(1) rotate(0deg) translateY(-30px); opacity:0; }
    }
    @keyframes confettiFall {
      0%   { transform:translateY(-20px) rotate(0deg); opacity:1; }
      100% { transform:translateY(100vh) rotate(720deg); opacity:0; }
    }

    @media (max-width:420px) {
      .pill { padding:9px 12px; font-size:15px; }
      .btn  { padding:9px 11px; font-size:13px; }
      .balloon { width:105px; height:130px; font-size:54px; }
    }
  </style>
</head>
<body>
<div style="position:relative;width:100%;height:100%;overflow:hidden;">
  <div class="clouds" id="clouds"></div>

  <div class="top">
    <div style="display:flex;gap:8px;align-items:center;">
      <div class="pill">⭐ <span id="score">0</span></div>
      <div class="pill">🏁 <span id="roundText">1/8</span></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button id="soundBtn" class="btn">🔊</button>
    </div>
  </div>

  <div class="hero">
    <div class="modeLine" id="modeLine">Learn Mode</div>
    <div class="word" id="word">Pop! 🎈</div>
    <div class="sub"  id="sub">Tap any balloon!</div>
    <div class="progressWrap"><div id="progressBar" class="progressBar"></div></div>
  </div>

  <div id="playArea" class="playArea"></div>
  <div class="celebration" id="celebration"></div>

  <div id="startOverlay" class="overlay">
    <div class="overlayCard">
      <div class="overlayTitle" id="overlayTitle">🎈 Pop the Balloons!</div>
      <div class="overlaySub"   id="overlaySub">Tap a balloon to pop it!</div>
      <div class="modePicker">
        <button class="modePickBtn active" id="pickLearn" onclick="selectMode('learn')">🎯 Learn<br><small style="font-size:12px;font-weight:700;">Tap anything!</small></button>
        <button class="modePickBtn"        id="pickFind"  onclick="selectMode('find')">🔎 Find<br><small style="font-size:12px;font-weight:700;">Find the word!</small></button>
      </div>
      <button id="startBtn" class="overlayBtn">▶ Start!</button>
    </div>
  </div>
</div>

<script>
// ─── WORD LIST ───────────────────────────────────────────────
const WORDS = [
  {emoji:"🐶",word:"Dog"}, {emoji:"🐱",word:"Cat"}, {emoji:"🐥",word:"Chick"},
  {emoji:"⭐",word:"Star"}, {emoji:"🌙",word:"Moon"}, {emoji:"☀️",word:"Sun"},
  {emoji:"🍎",word:"Apple"}, {emoji:"🚗",word:"Car"}, {emoji:"⚽",word:"Ball"},
  {emoji:"🐸",word:"Frog"}, {emoji:"🐰",word:"Rabbit"}, {emoji:"🐻",word:"Bear"},
  {emoji:"🦁",word:"Lion"}, {emoji:"🐼",word:"Panda"}, {emoji:"🦆",word:"Duck"},
  {emoji:"🐟",word:"Fish"}, {emoji:"🍌",word:"Banana"}, {emoji:"🌼",word:"Flower"},
  {emoji:"☁️",word:"Cloud"}, {emoji:"🚂",word:"Train"}, {emoji:"🧸",word:"Teddy"},
  {emoji:"🍪",word:"Cookie"}, {emoji:"🍉",word:"Melon"}, {emoji:"🐢",word:"Turtle"},
  {emoji:"🌈",word:"Rainbow"}, {emoji:"🐵",word:"Monkey"}, {emoji:"🎁",word:"Gift"},
];
const COLORS  = ["#ff8fab","#ffd166","#90e0ef","#caffbf","#bdb2ff","#ffc6a5","#ffcfef","#c7f9cc","#fdcfe8","#b8f0e6"];
const PRAISE  = ["Great!","Nice!","Yay!","Wow!","Super!","Yes!"];

// ─── STATE ───────────────────────────────────────────────────
let score=0, round=1, totalRounds=8;
let balloons=[];        // live balloon elements
let soundOn=true, started=false;
let mode="learn";
let voices=[], speechUnlocked=false;
let currentChoices=[], targetItem=null;
let wrongStreak=0;

// KEY FIX: single authoritative "round is running" flag controlled ONLY by nextRound()
let roundActive=false;
// KEY FIX: token to cancel stale timeouts across round transitions
let roundToken=0;

let audioCtx=null;

// ─── DOM ────────────────────────────────────────────────────
const playArea    =document.getElementById("playArea");
const wordEl      =document.getElementById("word");
const subEl       =document.getElementById("sub");
const scoreEl     =document.getElementById("score");
const soundBtn    =document.getElementById("soundBtn");
const roundText   =document.getElementById("roundText");
const modeLine    =document.getElementById("modeLine");
const progressBar =document.getElementById("progressBar");
const startOverlay=document.getElementById("startOverlay");
const startBtn    =document.getElementById("startBtn");
const overlayTitle=document.getElementById("overlayTitle");
const overlaySub  =document.getElementById("overlaySub");
const celebration =document.getElementById("celebration");

// ─── CLOUDS ─────────────────────────────────────────────────
(function(){
  const c=document.getElementById("clouds");
  [{left:"5%",top:"6%",w:90,h:40},{left:"35%",top:"3%",w:130,h:52},
   {left:"68%",top:"8%",w:100,h:42},{left:"20%",top:"18%",w:80,h:34},
   {left:"78%",top:"22%",w:110,h:44}].forEach(d=>{
    const el=document.createElement("div");
    el.style.cssText=`position:absolute;left:${d.left};top:${d.top};width:${d.w}px;height:${d.h}px;background:rgba(255,255,255,.65);border-radius:50%;filter:blur(2px);`;
    c.appendChild(el);
    [-0.4,0.3].forEach(offset=>{
      const b=document.createElement("div");
      const bw=d.w*0.55;
      b.style.cssText=`position:absolute;width:${bw}px;height:${d.h*1.2}px;background:rgba(255,255,255,.65);border-radius:50%;filter:blur(2px);top:-${d.h*0.3}px;left:${d.w*(0.5+offset)-bw/2}px;`;
      el.appendChild(b);
    });
  });
})();

// ─── SPEECH ─────────────────────────────────────────────────
function loadVoices(){
  if(!("speechSynthesis" in window))return;
  voices=window.speechSynthesis.getVoices();
}
if("speechSynthesis" in window){ loadVoices(); window.speechSynthesis.onvoiceschanged=loadVoices; }

function speak(text){
  if(!soundOn||!speechUnlocked||!("speechSynthesis" in window))return;
  try{
    window.speechSynthesis.cancel();
    if(!voices.length) voices=window.speechSynthesis.getVoices();
    const u=new SpeechSynthesisUtterance(text);
    const v=voices.find(v=>v.lang==="en-US")||voices.find(v=>v.lang==="en-GB")||
            voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("en"))||null;
    if(v) u.voice=v;
    u.rate=0.78; u.pitch=1.15; u.volume=1.0;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

// ─── AUDIO ──────────────────────────────────────────────────
function getCtx(){
  if(!audioCtx||audioCtx.state==="closed")
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq=620,dur=0.1,type="sine"){
  if(!soundOn)return;
  try{
    const ctx=getCtx(), osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type=type; osc.frequency.value=freq; gain.gain.value=0.0001;
    osc.connect(gain); gain.connect(ctx.destination);
    const now=ctx.currentTime;
    gain.gain.exponentialRampToValueAtTime(0.12,now+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+dur);
    osc.start(now); osc.stop(now+dur+0.05);
  }catch(e){}
}
function playPop(special){
  tone(special?900:680,0.1);
  setTimeout(()=>tone(special?1100:860,0.12),85);
  setTimeout(()=>tone(special?1300:1040,0.15),175);
}
function playCelebration(){
  [600,750,900,1100,1350].forEach((f,i)=>setTimeout(()=>tone(f,0.15),i*90));
}
function playWrong(){ tone(260,0.09,"triangle"); }

// ─── UTILS ──────────────────────────────────────────────────
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; } return a; }
function rand(min,max){ return Math.random()*(max-min)+min; }
function praise(){ return PRAISE[Math.floor(Math.random()*PRAISE.length)]; }

// ─── VFX ────────────────────────────────────────────────────
function floatWord(text,x,y){
  const fw=document.createElement("div");
  fw.className="floatWord"; fw.textContent=text;
  fw.style.left=x+"px"; fw.style.top=y+"px";
  playArea.appendChild(fw);
  setTimeout(()=>fw.remove(),950);
}
function burst(x,y){
  const syms=["✨","⭐","🎉","💫","🌟","❤️","🌈"];
  for(let i=0;i<6;i++){
    const b=document.createElement("div");
    b.className="burst";
    b.textContent=syms[Math.floor(Math.random()*syms.length)];
    b.style.left=(x+rand(-36,36))+"px"; b.style.top=(y+rand(-26,26))+"px";
    playArea.appendChild(b);
    setTimeout(()=>b.remove(),820);
  }
}
function showStar(x,y){
  const s=document.createElement("div");
  s.className="starPop"; s.textContent="⭐";
  s.style.left=(x-26)+"px"; s.style.top=(y-26)+"px";
  playArea.appendChild(s);
  setTimeout(()=>s.remove(),620);
}
function spawnConfetti(){
  celebration.innerHTML="";
  const cols=["#ffd166","#ff8fab","#7ae582","#90e0ef","#bdb2ff","#ffc6a5"];
  for(let i=0;i<48;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=rand(0,100)+"%"; c.style.top="-20px";
    c.style.background=cols[Math.floor(Math.random()*cols.length)];
    c.style.width=rand(8,14)+"px"; c.style.height=rand(8,14)+"px";
    c.style.borderRadius=Math.random()>0.5?"50%":"2px";
    c.style.animationDuration=rand(1.6,2.8)+"s";
    c.style.animationDelay=rand(0,0.8)+"s";
    celebration.appendChild(c);
  }
  setTimeout(()=>{ celebration.innerHTML=""; },3500);
}

// ─── HEADER ─────────────────────────────────────────────────
function updateHeader(){
  roundText.textContent=round+"/"+totalRounds;
  progressBar.style.width=(((round-1)/totalRounds)*100)+"%";
  scoreEl.textContent=score;
  if(mode==="learn"){
    modeLine.textContent="Learn Mode";
    if(!targetItem){ wordEl.textContent="Pop! 🎈"; subEl.textContent="Tap any balloon!"; }
  }else{
    modeLine.textContent="Find Mode";
    if(targetItem){ wordEl.textContent=targetItem.emoji+" "+targetItem.word; subEl.textContent="Find and pop it!"; }
  }
}

// ─── ROUND LIFECYCLE ────────────────────────────────────────
function chooseRoundWords(){
  currentChoices=shuffle(WORDS).slice(0,4);
  targetItem=mode==="find"?currentChoices[Math.floor(Math.random()*currentChoices.length)]:null;
}

function clearBalloons(){
  // Remove all balloons from DOM without triggering game logic
  balloons.forEach(b=>{ b._cleared=true; if(b.parentNode) b.remove(); });
  balloons=[];
}

// Called ONLY from two places: scheduleRoundTimeout callback and popBalloon success path
// The roundToken ensures only one call per round ever does anything.
function nextRound(token){
  if(token!==roundToken) return;   // stale call from previous round — ignore
  if(!started) return;
  roundActive=false;
  roundToken++;                    // invalidate any remaining timeouts for this round
  clearBalloons();
  round+=1;
  if(round>totalRounds){ endGame(); return; }
  wrongStreak=0;
  chooseRoundWords();
  updateHeader();
  layoutRound();
  if(mode==="find"&&targetItem) setTimeout(()=>speak(targetItem.word),350);
}

function scheduleRoundTimeout(){
  const token=roundToken;
  const maxDur=Math.max(...balloons.map(b=>parseFloat(b.dataset.dur||22)));
  setTimeout(()=>nextRound(token),(maxDur*1000)+600);
}

// ─── MAKE BALLOON ───────────────────────────────────────────
function makeBalloon(item,left,color,special){
  const b=document.createElement("button");
  b.className="balloon"+(special?" special":"");
  b.type="button";
  b.dataset.word=item.word;
  b.dataset.special=special?"1":"0";
  b._cleared=false;

  // Emoji in a span so the button element itself has only one child text node
  const emoji=document.createElement("span");
  emoji.textContent=item.emoji;
  emoji.style.pointerEvents="none";
  b.appendChild(emoji);

  if(special){
    // FIX: glimmer on child element, NOT on the balloon button
    // This means animationend on the button fires exactly ONCE (riseUp only)
    const gl=document.createElement("div");
    gl.className="glimmerLayer";
    b.appendChild(gl);
  }

  b.style.left=left+"px";
  b.style.bottom="-160px";
  b.style.background=color;

  const duration=rand(18,25);
  const delay=rand(0,2.2);
  b.style.animationDuration=duration+"s";
  b.style.animationDelay=delay+"s";
  b.dataset.dur=String(duration+delay);

  // ── TAP: use pointerdown for instant response ──
  // FIX: track whether this balloon has already been tapped
  b._tapped=false;
  b.addEventListener("pointerdown",(e)=>{
    e.preventDefault();
    e.stopPropagation();
    if(b._tapped||b._cleared) return;
    b._tapped=true;
    onBalloonTap(b,item);
  },{passive:false});

  // ── FIX: animationend now fires exactly once (only riseUp on button) ──
  b.addEventListener("animationend",()=>{
    if(b._cleared) return;
    if(b.parentNode) b.remove();
    balloons=balloons.filter(x=>x!==b);
    // If ALL balloons have floated away (none left, none popping), advance round
    // But only trigger this logic once, using roundToken
    if(roundActive && balloons.length===0){
      const token=roundToken;
      setTimeout(()=>nextRound(token),400);
    }
  });

  playArea.appendChild(b);
  balloons.push(b);
}

// ─── POP BALLOON ────────────────────────────────────────────
function popBalloon(b,item,good,special){
  b._tapped=true;                  // prevent any re-entry
  b.classList.add("popping");      // CSS overrides riseUp, shrinks to dot

  const rect=b.getBoundingClientRect();
  const x=rect.left+rect.width/2;
  const y=rect.top+rect.height/2;

  burst(x,y);
  floatWord(item.word,x-30,y-14);

  if(good){
    score+=special?3:1;
    scoreEl.textContent=score;
    showStar(x,y-20);
    playPop(special);
  }else{
    playWrong();
  }

  // Remove from DOM after pop animation (0.22s)
  setTimeout(()=>{
    b._cleared=true;
    if(b.parentNode) b.remove();
    balloons=balloons.filter(x=>x!==b);
  },250);
}

// ─── TAP HANDLER ────────────────────────────────────────────
function onBalloonTap(b,item){
  if(!roundActive) return;
  const isSpecial=b.dataset.special==="1";

  if(mode==="learn"){
    wordEl.textContent=item.emoji+" "+item.word;
    subEl.textContent=praise();
    speak(item.word);
    popBalloon(b,item,true,isSpecial);

    // Count remaining live (not yet tapped, not cleared) balloons
    const remaining=balloons.filter(x=>!x._tapped&&!x._cleared);
    if(remaining.length===0){
      const token=roundToken;
      setTimeout(()=>nextRound(token),520);
    }
    return;
  }

  // Find mode
  if(item.word===targetItem.word){
    wrongStreak=0;
    wordEl.textContent=item.emoji+" "+item.word;
    subEl.textContent=praise()+(isSpecial?" Bonus!":"");
    speak(item.word);
    popBalloon(b,item,true,isSpecial);
    const token=roundToken;
    setTimeout(()=>nextRound(token),560);
  }else{
    wrongStreak+=1;
    subEl.textContent=wrongStreak>=2?"Look for "+targetItem.word+"!":"Oops! Try again!";
    b._tapped=false; // allow re-tap after shake
    // Shake via CSS class swap (no animation property mutation)
    b.style.transition="transform 0.07s ease";
    let s=0;
    const shakes=[-10,10,-8,8,-4,4,0];
    function doShake(){
      if(s>=shakes.length){ b.style.transform=""; b.style.transition=""; return; }
      b.style.transform="translateX("+shakes[s]+"px)";
      s++; setTimeout(doShake,60);
    }
    doShake();
    playWrong();
    if(wrongStreak>=2) setTimeout(()=>speak(targetItem.word),200);
  }
}

// ─── LAYOUT ROUND ───────────────────────────────────────────
function layoutRound(){
  clearBalloons();
  roundActive=true;
  const w=window.innerWidth;
  const bw=w<420?105:120;
  const lanes=[0.14,0.36,0.60,0.82];
  const specialIndex=Math.random()<0.3?Math.floor(Math.random()*4):-1;
  currentChoices.forEach((item,i)=>{
    const lx=lanes[i%lanes.length];
    const left=Math.max(6,Math.min(w-bw-6,(w*lx)-(bw/2)+rand(-6,6)));
    makeBalloon(item,left,COLORS[i%COLORS.length],i===specialIndex);
  });
  scheduleRoundTimeout();
}

// ─── END GAME ───────────────────────────────────────────────
function endGame(){
  roundActive=false;
  roundToken++;
  progressBar.style.width="100%";
  clearBalloons();
  spawnConfetti();
  playCelebration();
  overlayTitle.textContent="Yay! All done! 🎉";
  overlaySub.textContent="You got "+score+" stars! ⭐";
  startBtn.textContent="▶ Play Again!";
  startOverlay.classList.remove("hidden");
  started=false;
}

// ─── START GAME ─────────────────────────────────────────────
function startGame(){
  speechUnlocked=true;
  started=true;
  roundActive=false;
  roundToken++;            // invalidate any lingering timeouts from previous game
  startOverlay.classList.add("hidden");
  try{ getCtx().resume(); }catch(e){}
  if("speechSynthesis" in window){
    try{ const s=new SpeechSynthesisUtterance(" "); s.volume=0; window.speechSynthesis.speak(s); }catch(e){}
  }
  score=0; round=1; wrongStreak=0;
  chooseRoundWords(); updateHeader(); layoutRound(); tone(700,0.08);
  if(mode==="find"&&targetItem) setTimeout(()=>speak(targetItem.word),400);
}

// ─── MODE PICKER ────────────────────────────────────────────
function selectMode(m){
  mode=m;
  document.getElementById("pickLearn").classList.toggle("active",m==="learn");
  document.getElementById("pickFind").classList.toggle("active",m==="find");
}

// ─── BUTTONS ────────────────────────────────────────────────
soundBtn.addEventListener("click",()=>{
  soundOn=!soundOn;
  soundBtn.textContent=soundOn?"🔊":"🔇";
  if(soundOn) tone(700,0.06);
});

// FIX: use click (not pointerdown) on start button to avoid ghost events from overlay dismiss
startBtn.addEventListener("click",startGame);
startOverlay.addEventListener("click",(e)=>{ if(e.target===startOverlay) startGame(); });

window.addEventListener("resize",()=>{ if(started) layoutRound(); });
document.addEventListener("visibilitychange",()=>{
  if(document.hidden&&"speechSynthesis" in window) window.speechSynthesis.cancel();
});

updateHeader();
</script>
